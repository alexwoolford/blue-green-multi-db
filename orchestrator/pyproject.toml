[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluegreen"
version = "1.0.0"
description = "Blue/green full refresh harness for Neo4j Aura MultiDB and self-managed Enterprise."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "neo4j>=5.26,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.21,<1",
]

[project.scripts]
bg = "bluegreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local: integration test requiring the compose neo4j-local service",
]
