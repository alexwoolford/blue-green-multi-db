name: aura-bluegreen

services:
  neo4j-local:
    image: neo4j:${NEO4J_TAG}-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT}
      NEO4J_AUTH: neo4j/${NEO4J_LOCAL_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      # Host ports are offset so a Neo4j already listening on 7474/7687 is left alone.
      # Inside the compose network the server is still neo4j-local:7687.
      - "17474:7474"
      - "17687:7687"
    volumes:
      - local-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60

  toolbox:
    build:
      context: .
      dockerfile: toolbox/Dockerfile
      args:
        NEO4J_TAG: ${NEO4J_TAG}
    env_file: .env
    environment:
      NEO4J_LOCAL_URI: neo4j://neo4j-local:7687
      WORK_DIR: /work
    user: "7474:7474"
    volumes:
      - local-data:/local-data
      - build-data:/build-data
      - ./work:/work
    depends_on:
      neo4j-local:
        condition: service_healthy
    entrypoint: ["bg"]
    profiles: ["tools"]

volumes:
  local-data:
  build-data:
